<!-- ===== فرم ثبت نظر (دکوری) ===== -->
<div class="review-box">
    <div style="background: #eef3f9; padding: 10px 16px; border-radius: 12px; margin-bottom: 18px; text-align: center; font-size: 14px; color: #004687;">
        🔐 لطفا <a href="#" style="color: #e56688; font-weight: 700;">وارد شوید</a> یا <a href="#" style="color: #e56688; font-weight: 700;">ثبت نام کنید</a> تا دیدگاه خود را بنویسید.
    </div>
    <h4>📝 نظر شما برای ما ارزشمند است</h4>
    <div class="sub">نشانی ایمیل شما منتشر نخواهد شد. بخش‌های موردنیاز علامت‌گذاری شده‌اند.</div>
    <form>
        <div class="form-group">
            <label>دیدگاه شما *</label>
            <textarea rows="3" placeholder="دیدگاه خود را بنویسید..."></textarea>
        </div>
        <div class="row2">
            <div class="form-group">
                <label>نام و نام خانوادگی کودک *</label>
                <input type="text" placeholder="نام و نام خانوادگی کودک">
            </div>
            <div class="form-group">
                <label>ایمیل شما *</label>
                <input type="email" placeholder="ایمیل شما">
            </div>
        </div>
        <div class="form-group">
            <label>مقطع فرزند</label>
            <select style="width:100%; padding:10px 14px; border:1px solid #dde3ec; border-radius:12px; font-family:inherit; font-size:14px; background:#fff;">
                <option value="">انتخاب مقطع...</option>
                <option>مهدکودک</option>
                <option>پیش‌دبستان</option>
                <option>دبستان</option>
                <option>دوره‌های ترمیک</option>
                <option>دوره‌های آنلاین</option>
            </select>
        </div>
        <div class="save-info">
            <input type="checkbox" id="save-info">
            <label for="save-info">ذخیره نام، ایمیل و وبسایت من در مرورگر برای زمانی که دوباره دیدگاهی می‌نویسم.</label>
        </div>
        <button type="submit" class="btn-review">فرستادن دیدگاه</button>
    </form>
</div>
